<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind Baker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e8e8e8;
      --text: #1a1a1a;
      --muted: #888;
      --ratio-color: #555;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --surface: #1c1c1c;
        --border: #2e2e2e;
        --text: #e8e8e8;
        --muted: #777;
        --ratio-color: #aaaaaa;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.9rem 1rem;
      margin-bottom: 0.5rem;
    }

    .card-name {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .card-ratio {
      font-family: "SF Mono", "Fira Code", "Courier New", monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ratio-color);
      letter-spacing: 0.03em;
    }

    .card-ratio-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: 0.4rem;
    }

    .card-ingredients {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

<main id="cards"></main>

<script>
const recipes = [
  // ── BAKING ────────────────────────────────────────────────
  {
    category: "Baking", sub: "Bread",
    name: "Basic Bread",
    ratio: "5 : 3", label: "flour : water",
    ingredients: ["flour", "water", "yeast", "salt"]
  },
  {
    category: "Baking", sub: "Cakes",
    name: "Pound Cake",
    ratio: "1 : 1 : 1 : 1", label: "butter : sugar : eggs : flour",
    ingredients: ["butter", "sugar", "eggs", "flour", "vanilla", "salt"]
  },
  {
    category: "Baking", sub: "Cakes",
    name: "Sponge / Genoise",
    ratio: "1 : 1 : 1", label: "eggs : sugar : flour",
    ingredients: ["eggs", "sugar", "flour", "clarified butter (optional)"]
  },
  {
    category: "Baking", sub: "Cookies",
    name: "Basic Cookie (3-2-1)",
    ratio: "3 : 2 : 1", label: "flour : fat : sugar",
    ingredients: ["flour", "butter", "sugar", "egg", "vanilla", "salt", "baking soda"]
  },
  {
    category: "Baking", sub: "Pie Dough",
    name: "Standard Pie Dough (3-2-1)",
    ratio: "3 : 2 : 1", label: "flour : fat : water",
    ingredients: ["flour", "butter", "ice water", "salt"]
  },
  {
    category: "Baking", sub: "Biscuits",
    name: "Biscuits",
    ratio: "3 : 1 : 2", label: "flour : fat : liquid",
    ingredients: ["flour", "butter", "buttermilk", "baking powder", "salt"]
  },
  {
    category: "Baking", sub: "Meringue",
    name: "French Meringue",
    ratio: "1 : 2", label: "egg whites : sugar",
    ingredients: ["egg whites", "sugar", "cream of tartar"]
  },
  {
    category: "Baking", sub: "Quick Breads",
    name: "Pancakes",
    ratio: "1 : 1 : 1", label: "flour : milk : egg",
    ingredients: ["flour", "milk", "egg", "butter", "sugar", "baking powder", "salt"]
  },
  {
    category: "Baking", sub: "Quick Breads",
    name: "Crêpes",
    ratio: "2 : 1 : 1", label: "milk : flour : eggs",
    ingredients: ["milk", "flour", "eggs", "butter", "salt"]
  },

  // ── SAUCES ────────────────────────────────────────────────
  {
    category: "Sauces", sub: "Mother Sauces",
    name: "Béchamel",
    ratio: "1 : 1 : 8", label: "butter : flour : milk",
    ingredients: ["butter", "flour", "whole milk", "salt", "white pepper", "nutmeg"]
  },
  {
    category: "Sauces", sub: "Mother Sauces",
    name: "Velouté",
    ratio: "1 : 1 : 8", label: "butter : flour : light stock",
    ingredients: ["butter", "flour", "chicken / fish / veal stock", "salt", "white pepper"]
  },
  {
    category: "Sauces", sub: "Mother Sauces",
    name: "Espagnole",
    ratio: "1 : 1 : 8", label: "butter : flour : brown stock",
    ingredients: ["butter", "flour", "brown stock", "tomato paste", "onion", "carrot", "celery", "salt", "pepper"]
  },
  {
    category: "Sauces", sub: "Mother Sauces",
    name: "Hollandaise",
    ratio: "1 : 5", label: "egg yolks : clarified butter",
    ingredients: ["egg yolks", "clarified butter", "lemon juice", "cayenne", "salt"]
  },
  {
    category: "Sauces", sub: "Mother Sauces",
    name: "Tomato Sauce",
    ratio: "—", label: "no fixed ratio",
    ingredients: ["tomatoes", "stock", "onion", "garlic", "carrot", "butter", "bay leaf", "salt", "pepper"]
  },
];

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function render() {
  const sections = {};
  recipes.forEach(r => {
    if (!sections[r.category]) sections[r.category] = {};
    if (!sections[r.category][r.sub]) sections[r.category][r.sub] = [];
    sections[r.category][r.sub].push(r);
  });

  let html = "";
  for (const [category, groups] of Object.entries(sections)) {
    for (const [sub, items] of Object.entries(groups)) {
      items.forEach(r => {
        html += `
        <div class="card">
          <div class="card-name">${esc(r.name)}</div>
          <div>
            <span class="card-ratio">${esc(r.ratio)}</span>
            <span class="card-ratio-label">${esc(r.label)}</span>
          </div>
          <div class="card-ingredients">${esc(r.ingredients.join(", "))}</div>
        </div>`;
      });
    }
  }

  document.getElementById("cards").innerHTML = html;
}

render();
</script>
</body>
</html>
